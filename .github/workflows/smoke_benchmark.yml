name: Smoke Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Pytest Discovery & Test Suite
      run: |
        pytest tests/
        python tests/test_oracle_and_serialization.py
        python tests/test_clifford_tableau.py

    - name: Run Bounded Clifford Benchmark & Smoke Test
      run: |
        python quantum_circuit_research/benchmark_clifford_tableau.py
        python parallel_contraction_research/proper_research/smoke_benchmark.py
