name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest        # topics/ only, see pytest.ini; agent evals are frozen and not tested
